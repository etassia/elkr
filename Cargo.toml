[package]
name = "elkr"
version = "0.1.2"
edition = "2021"
description = "Deterministic graph layout: a Rust implementation of the Eclipse Layout Kernel algorithms, ported from metanorma/elkrb"
license = "BSD-2-Clause"
repository = "https://github.com/etassia/elkr"
keywords = ["layout", "elk", "graph", "diagram", "sugiyama"]
categories = ["graphics", "visualization"]

[lib]
name = "elkr"

[[bin]]
name = "elkr"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = true
