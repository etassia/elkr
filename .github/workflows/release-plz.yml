# Release pipeline for elkr (the etassia-rs / parsanol-rs approach)
#
# On every push to main, release-plz computes the next version from
# conventional commits, opens the release PR (merging it is the release
# decision), and publishes the touched publishable crates to crates.io.
#
# Publishing authenticates through crates.io Trusted Publishing (RFC 3691):
# the workflow's OIDC token is exchanged for a 30-minute registry token by
# rust-lang/crates-io-auth-action, matched against the registration in the
# crate's crates.io settings (repository etassia/elkr, workflow
# release-plz.yml, no environment). There is no CARGO_REGISTRY_TOKEN secret.
#
# The release PR is created with GITHUB_TOKEN. It does not trigger CI on
# itself (a deliberate GitHub restriction), which is acceptable here: the
# release PR is the mechanical version bump, elkr has no branch protection,
# and merging it triggers this workflow to publish.

name: Release-plz

permissions:
  pull-requests: write
  contents: write
  id-token: write

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Serialize runs: two overlapping release-plz invocations raced on the
# pre-merge snapshot and opened a duplicate release PR (parsanol-rs #227).
concurrency:
  group: release-plz
  cancel-in-progress: false

jobs:
  release-plz:
    name: Release-plz
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Exchange the OIDC token for a crates.io publish token
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Run release-plz
        uses: MarcoIeni/release-plz-action@v0.5
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
